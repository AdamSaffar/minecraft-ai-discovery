plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    testImplementation 'junit:junit:4.13.2'
}

def modVersion = version
processResources {
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def minecraftJavaExecutable = providers.gradleProperty('minecraftJavaExecutable')
def translucentProbe = providers.gradleProperty('translucentProbe')
tasks.named('runClient', JavaExec) {
    if (minecraftJavaExecutable.isPresent()) {
        executable = minecraftJavaExecutable.get()
    }
    if (translucentProbe.isPresent()) {
        systemProperty 'semanticObservation.translucentProbe', translucentProbe.get()
    }
}

tasks.register('runBaseQualificationCalibration', JavaExec) {
    group = 'verification'
    description = 'Runs the researcher-only offline base-qualification calibration tool.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.minecraftaidiscovery.semantic.visibility.BaseQualificationCalibrationStudy'

    doFirst {
        def mode = providers.gradleProperty('calibrationMode').orNull
        def manifest = providers.gradleProperty('calibrationManifest').orNull
        def probeRoot = providers.gradleProperty('calibrationProbeRoot').orNull
        def output = providers.gradleProperty('calibrationOutput').orNull
        if (mode == null || manifest == null || probeRoot == null || output == null) {
            throw new GradleException(
                'Provide calibrationMode, calibrationManifest, calibrationProbeRoot, and calibrationOutput.'
            )
        }
        args mode, manifest, probeRoot, output
        if (mode != 'generate') {
            def responses = providers.gradleProperty('calibrationResponses').orNull
            if (responses == null) {
                throw new GradleException(
                    'Provide calibrationResponses for a scoring mode.'
                )
            }
            args responses
        }
    }
}
